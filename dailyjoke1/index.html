<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Joke #1 | Prodigy Athletics</title>
  <meta name="description" content="Today's joke from Kenny at Prodigy Athletics.">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Daily Joke #1 | Prodigy Athletics">
  <meta property="og:description" content="Today's joke from Kenny at Prodigy Athletics.">
  <meta property="og:image" content="https://prodigyathletics.ca/images/jokes/dailyjoke1.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080808; --border: #2e2e2e; --text: #ffffff; --text-muted: #a0a0a0;
      --accent: #cea952; --accent-light: #dfc06a;
      --font-cinzel: 'Cinzel', serif;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }

    nav {
      background: rgba(8,8,8,0.95); border-bottom: 1px solid #1e1e1e;
      padding: 0 32px; height: 68px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { display: flex; align-items: center; text-decoration: none; height: 44px; }
    .nav-logo img { height: 44px; width: auto; display: block; }
    .nav-cta {
      background: var(--accent); color: #000;
      padding: 9px 22px; border-radius: 6px;
      text-decoration: none; font-size: 14px; font-weight: 700;
      transition: background 0.15s;
    }
    .nav-cta:hover { background: var(--accent-light); }

    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; text-align: center; }
    .joke-label { font-size: 11px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
    h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 800; margin-bottom: 28px; }
    .joke-img {
      max-width: 720px; width: 100%; border-radius: 14px;
      border: 1px solid var(--border); display: block;
      box-shadow: 0 0 40px rgba(206,169,82,0.12);
    }
    .joke-caption { margin-top: 22px; font-size: 15px; color: var(--text-muted); max-width: 520px; }

    footer { padding: 32px 24px; border-top: 1px solid var(--border); text-align: center; }
    footer p:first-child { font-family: var(--font-cinzel); font-size: 16px; font-weight: 700; color: var(--accent); margin-bottom: 8px; letter-spacing: 0.08em; }
    footer p { font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo"><img src="/logo.svg" alt="Prodigy Athletics"></a>
  <a href="/" class="nav-cta">Visit the Site</a>
</nav>

<main>
  <p class="joke-label">From Kenny's Desk</p>
  <img class="joke-img" src="/images/jokes/dailyjoke1.jpg" alt="The This Is Fine dog sitting calmly in a burning room with his coffee.">
  <p class="joke-caption">Every hockey parent in week one of tryouts.</p>
</main>

<footer>
  <p>PRODIGY ATHLETICS</p>
  <p>Building confident leaders one athlete at a time.</p>
</footer>

</body>
</html>
